name: Build APK Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Criar estrutura Android nativa
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms android --project-name financaspessoais .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Forcar versao do Kotlin
        run: |
          python3 << 'PYEOF'
          import os, re
          KOTLIN_VER = '1.9.23'
          RESOLUTION = (
            '\nconfigurations.all {\n'
            '    resolutionStrategy {\n'
            '        force "org.jetbrains.kotlin:kotlin-stdlib:' + KOTLIN_VER + '"\n'
            '        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + KOTLIN_VER + '"\n'
            '        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + KOTLIN_VER + '"\n'
            '    }\n'
            '}\n'
          )
          for path in ['android/build.gradle', 'android/build.gradle.kts']:
              if not os.path.exists(path):
                  continue
              content = open(path).read()
              new_content = re.sub(
                  r"(ext\.kotlin_version\s*=\s*)['\"][\d.]+['\"]",
                  r"\g<1>'" + KOTLIN_VER + "'",
                  content
              )
              if new_content == content and 'kotlin_version' not in content and 'buildscript' in content:
                  new_content = re.sub(
                      r'(buildscript\s*\{)',
                      r'\1\n    ext.kotlin_version = "' + KOTLIN_VER + '"',
                      content, count=1
                  )
              if new_content != content:
                  open(path, 'w').write(new_content)
                  print('Kotlin version forced in ' + path)
          for path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if not os.path.exists(path):
                  continue
              content = open(path).read()
              if 'resolutionStrategy' not in content:
                  open(path, 'w').write(content + RESOLUTION)
                  print('resolutionStrategy added to ' + path)
          PYEOF

      - name: Patch pub cache - corrigir build.gradle com flutter.minSdkVersion
        run: |
          python3 << 'PYEOF'
          import os, glob, re
          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          patterns = [
              f"{pub_cache}/**/passkeys_doctor*/android/build.gradle",
              f"{pub_cache}/**/passkeys_android*/android/build.gradle",
              f"{pub_cache}/**/ua_client_hints*/android/build.gradle",
          ]
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  content = open(path).read()
                  content = content.replace("flutter.minSdkVersion", "23")
                  content = content.replace("flutter.compileSdkVersion", "35")
                  content = content.replace("flutter.targetSdkVersion", "35")
                  open(path, "w").write(content)
                  print(f"Patched: {path}")
          PYEOF

      - name: Corrigir minSdk no projeto
        run: |
          python3 << 'PYEOF'
          import os, re
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path): continue
              content = open(path).read()
              content = re.sub(r'flutter\.minSdkVersion', '23', content)
              content = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', content)
              if 'ndkVersion' not in content:
                  content = re.sub(r'(android\s*\{)', r'\1\n    ndkVersion = "27.0.12077973"', content, count=1)
              open(path, "w").write(content)
              print(f"Corrigido: {path}")
          PYEOF

      - name: Build APK release
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Build APK universal
        run: flutter build apk --release --dart-define=SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPessoais-Flutter-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  build-web:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Habilitar plataforma web
        run: |
          flutter config --enable-web
          flutter doctor

      - name: Get dependencies
        run: flutter pub get

      - name: Criar estrutura web
        run: |
          flutter create --platforms web --project-name financaspessoais .
          rm -f test/widget_test.dart
          flutter pub get

      - name: Configurar PWA manifest e index.html para iOS
        run: |
          python3 << 'PYEOF'
          import json, os, re

          # ── manifest.json ──────────────────────────────────
          manifest_path = 'web/manifest.json'
          if os.path.exists(manifest_path):
              with open(manifest_path) as f:
                  m = json.load(f)
              m['display'] = 'standalone'
              m['name'] = 'Finanças Pessoais'
              m['short_name'] = 'Finanças'
              m['background_color'] = '#0F1117'
              m['theme_color'] = '#0F1117'
              with open(manifest_path, 'w') as f:
                  json.dump(m, f, indent=2, ensure_ascii=False)
              print('manifest.json atualizado')

          # ── index.html — meta tags iOS ──────────────────────
          index_path = 'web/index.html'
          if os.path.exists(index_path):
              html = open(index_path).read()

              # viewport-fit=cover para conteúdo chegar até o notch
              html = re.sub(
                  r'(<meta\s+name="viewport"[^>]*content=")([^"]*?)(")',
                  lambda m: m.group(1) + m.group(2).rstrip(', ') + ', viewport-fit=cover' + m.group(3)
                  if 'viewport-fit' not in m.group(2) else m.group(0),
                  html
              )

              # Meta tags iOS PWA — inserir antes de </head>
              ios_tags = (
                  '\n    <!-- iOS PWA: status bar transparente -->'
                  '\n    <meta name="apple-mobile-web-app-capable" content="yes">'
                  '\n    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
                  '\n    <meta name="apple-mobile-web-app-title" content="Finanças">'
                  '\n    <meta name="theme-color" content="#0F1117">'
              )

              if 'apple-mobile-web-app-capable' not in html:
                  html = html.replace('</head>', ios_tags + '\n  </head>')

              open(index_path, 'w').write(html)
              print('index.html atualizado com meta tags iOS')
          PYEOF

      - name: Build Web
        run: flutter build web --release --base-href "/financas-flutter/" --dart-define=SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

  deploy-functions:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.26.0

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy admin-users --project-ref cogmxnspkpqycygqlvwu --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
