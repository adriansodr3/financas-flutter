name: Build APK Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Criar estrutura Android nativa
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms android --project-name financaspessoais .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Corrigir minSdk via Python
        run: |
          python3 << 'PYEOF'
          import os, re

          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path):
                  continue
              content = open(path).read()
              print(f"=== {path} (original) ===")
              print(content)
              # Substituir qualquer variante de minSdk
              content = re.sub(r'flutter\.minSdkVersion', '23', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.\S+', 'minSdk = 23', content)
              content = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s*\(?\s*\d+\s*\)?', 'minSdkVersion 23', content)
              # ndkVersion
              if 'ndkVersion' not in content:
                  content = re.sub(r'(android\s*\{)', r'\1\n    ndkVersion = "27.0.12077973"', content, count=1)
              print(f"=== {path} (corrigido) ===")
              print(content)
              open(path, "w").write(content)
          PYEOF

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Build APK universal
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPessoais-Flutter-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
