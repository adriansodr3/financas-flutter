name: Build APK Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch pub cache - corrigir build.gradle com flutter.minSdkVersion
        run: |
          python3 << 'PYEOF'
          import os, glob, re

          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          print(f"PUB_CACHE: {pub_cache}")

          # Encontrar todos os build.gradle de pacotes problemáticos
          patterns = [
              f"{pub_cache}/**/passkeys_doctor*/android/build.gradle",
              f"{pub_cache}/**/passkeys_android*/android/build.gradle",
              f"{pub_cache}/**/ua_client_hints*/android/build.gradle",
          ]

          fixed = []
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  content = open(path).read()
                  print(f"\n=== {path} ===")
                  print(content[:400])

                  # Substituir referencias ao plugin flutter por valores fixos
                  content = content.replace("flutter.minSdkVersion", "23")
                  content = content.replace("flutter.compileSdkVersion", "35")
                  content = content.replace("flutter.targetSdkVersion", "35")
                  content = content.replace("flutter.minSdk", "23")
                  content = content.replace("flutter.compileSdk", "35")
                  content = content.replace("flutter.targetSdk", "35")

                  open(path, "w").write(content)
                  fixed.append(path)
                  print(f"CORRIGIDO: {path}")

          if not fixed:
              print("Nenhum arquivo encontrado para corrigir - listando pub cache:")
              for root, dirs, files in os.walk(pub_cache):
                  for f in files:
                      if f == "build.gradle" and "android" in root:
                          full = os.path.join(root, f)
                          if any(x in full for x in ["passkeys", "ua_client"]):
                              print(f"  {full}")
          PYEOF

      - name: Criar estrutura Android nativa
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms android --project-name financaspessoais .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Patch pub cache pos-create
        run: |
          python3 << 'PYEOF'
          import os, glob

          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          patterns = [
              f"{pub_cache}/**/passkeys_doctor*/android/build.gradle",
              f"{pub_cache}/**/passkeys_android*/android/build.gradle",
              f"{pub_cache}/**/ua_client_hints*/android/build.gradle",
          ]
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  content = open(path).read()
                  content = content.replace("flutter.minSdkVersion", "23")
                  content = content.replace("flutter.compileSdkVersion", "35")
                  content = content.replace("flutter.targetSdkVersion", "35")
                  open(path, "w").write(content)
                  print(f"Patched: {path}")
          PYEOF

      - name: Corrigir minSdk no projeto
        run: |
          python3 << 'PYEOF'
          import os, re
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path): continue
              content = open(path).read()
              content = re.sub(r'flutter\.minSdkVersion', '23', content)
              content = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', content)
              if 'ndkVersion' not in content:
                  content = re.sub(r'(android\s*\{)', r'\1\n    ndkVersion = "27.0.12077973"', content, count=1)
              open(path, "w").write(content)
              print(f"Corrigido: {path}")
          PYEOF

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Build APK universal
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPessoais-Flutter-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  build-web:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/"

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
