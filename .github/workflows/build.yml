name: Build APK Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Criar estrutura Android nativa
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms android --project-name financaspessoais .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Inspecionar e corrigir build.gradle.kts
        run: |
          echo "=== Arquivos gradle ===" 
          ls android/app/build.gradle* 2>/dev/null || echo "nenhum"
          echo ""
          echo "=== Conteudo build.gradle.kts ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null

          python3 << 'PYEOF'
          import os, re

          path = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          content = open(path).read()

          # Substituir qualquer referência a minSdk por 22
          content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 22', content)
          content = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 22', content)
          content = re.sub(r'minSdkVersion\s*=\s*flutter\.minSdkVersion', 'minSdkVersion = 22', content)
          content = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 22', content)
          content = re.sub(r'minSdkVersion\(\d+\)', 'minSdkVersion(22)', content)
          content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 22', content)

          # ndkVersion
          if 'ndkVersion' not in content:
              content = content.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)
          else:
              content = re.sub(r'ndkVersion\s*=\s*["\'].*?["\']', 'ndkVersion = "27.0.12077973"', content)

          open(path, "w").write(content)
          print("=== APOS CORRECAO ===")
          print(content)
          PYEOF

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Build APK universal
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPessoais-Flutter-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
