name: Build APK Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Criar estrutura Android nativa
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms android --project-name financaspessoais .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Corrigir minSdk e ndkVersion via Python
        run: |
          python3 << 'PYEOF'
          import os, re

          # Encontrar o arquivo gradle (pode ser .kts ou .gradle)
          candidates = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ]
          path = next((p for p in candidates if os.path.exists(p)), None)
          print(f"Arquivo encontrado: {path}")

          content = open(path).read()
          print("=== ANTES ===")
          print(content[:800])

          # Corrigir minSdk
          content = content.replace("minSdk = 21", "minSdk = 22")
          content = content.replace("minSdkVersion = 21", "minSdkVersion = 22")
          content = content.replace("minSdkVersion(21)", "minSdkVersion(22)")
          content = content.replace("minSdkVersion 21", "minSdkVersion 22")

          # Adicionar ndkVersion dentro do bloco android {}
          if "ndkVersion" not in content:
              content = content.replace(
                  "android {",
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          open(path, "w").write(content)
          print("=== DEPOIS ===")
          print(content[:800])
          PYEOF

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Build APK universal
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FinancasPessoais-Flutter-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
