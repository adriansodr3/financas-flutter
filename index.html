<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/financas-flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="financaspessoais">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>financaspessoais</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
  window.subscribeToPush = function(vapidPublicKey, onSuccess, onError) {
    function urlB64ToUint8Array(b) {
      var pad = "=".repeat((4 - b.length % 4) % 4);
      var raw = atob((b + pad).replace(/-/g, "+").replace(/_/g, "/"));
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    if (!("Notification" in window) || !navigator.serviceWorker) {
      return onError("nao suportado");
    }
    Notification.requestPermission().then(function(perm) {
      if (perm !== "granted") return onError("permissao negada");
      navigator.serviceWorker.ready.then(function(reg) {
        reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(vapidPublicKey)
        }).then(function(sub) {
          var k = sub.getKey("p256dh");
          var a = sub.getKey("auth");
          function b64(buf) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
              .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
          }
          onSuccess({ endpoint: sub.endpoint, p256dh: b64(k), auth: b64(a) });
        }).catch(function(e) { onError(String(e)); });
      });
    });
  };
  window.unsubscribeFromPush = function(onDone) {
    if (!navigator.serviceWorker) return onDone(null);
    navigator.serviceWorker.ready.then(function(reg) {
      reg.pushManager.getSubscription().then(function(sub) {
        if (!sub) return onDone(null);
        var ep = sub.endpoint;
        sub.unsubscribe().then(function() { onDone(ep); }).catch(function() { onDone(null); });
      });
    });
  };
  </script>
</body>
</html>
